name: build-vep-116.1-linux-x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      # Match the target server's Ubuntu 20.04 / glibc 2.31 baseline.
      image: ubuntu:20.04
    timeout-minutes: 120

    steps:
      - name: Install user-environment builder
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl bzip2 xz-utils
          rm -rf /var/lib/apt/lists/*

          mkdir -p /opt/micromamba-bin "$GITHUB_WORKSPACE/build_metadata"
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C /opt/micromamba-bin --strip-components=1 bin/micromamba
          /opt/micromamba-bin/micromamba --version \
            | tee "$GITHUB_WORKSPACE/build_metadata/micromamba_version.txt"

      - name: Create fixed VEP 116.1 environment
        shell: bash
        run: |
          set -euo pipefail
          export MAMBA_ROOT_PREFIX="$GITHUB_WORKSPACE/.mamba"
          env_prefix="$GITHUB_WORKSPACE/vep116_env"

          /opt/micromamba-bin/micromamba create -y -p "$env_prefix" \
            --strict-channel-priority \
            -c conda-forge -c bioconda \
            'ensembl-vep=116.1' conda-pack

          /opt/micromamba-bin/micromamba list -p "$env_prefix" \
            > "$GITHUB_WORKSPACE/build_metadata/vep116.1_package_list.txt"
          /opt/micromamba-bin/micromamba list -p "$env_prefix" --explicit \
            > "$GITHUB_WORKSPACE/build_metadata/vep116.1_explicit_linux-64.txt"

          "$env_prefix/bin/vep" --help \
            > "$GITHUB_WORKSPACE/build_metadata/vep_help.txt"
          "$env_prefix/bin/perl" -v \
            > "$GITHUB_WORKSPACE/build_metadata/perl_version.txt"
          grep -E '^ensembl-vep[[:space:]]+116\.1([[:space:]]|$)' \
            "$GITHUB_WORKSPACE/build_metadata/vep116.1_package_list.txt"

      - name: Pack and checksum environment
        shell: bash
        run: |
          set -euo pipefail
          export MAMBA_ROOT_PREFIX="$GITHUB_WORKSPACE/.mamba"
          env_prefix="$GITHUB_WORKSPACE/vep116_env"
          artifact_dir="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$artifact_dir"

            /opt/micromamba-bin/micromamba run -p "$env_prefix" \
            conda-pack -p "$env_prefix" \
            -o "$artifact_dir/vep116.1_linux-x86_64_glibc2.31.tar.gz"

          cp "$GITHUB_WORKSPACE"/build_metadata/* "$artifact_dir/"
          cp /etc/os-release "$artifact_dir/builder_os_release.txt"
          ldd --version 2>&1 | head -n 1 \
            > "$artifact_dir/builder_glibc_version.txt"
          sha256sum "$artifact_dir/vep116.1_linux-x86_64_glibc2.31.tar.gz" \
            > "$artifact_dir/vep116.1_linux-x86_64_glibc2.31.tar.gz.sha256"

      - name: Upload frozen runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: vep116.1-linux-x86_64-glibc2.31
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

